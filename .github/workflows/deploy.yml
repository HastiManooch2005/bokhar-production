name: Deploy to VPS

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Production Deploy
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # SSH SETUP
      # ==========================================================

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts


      # ==========================================================
      # DEPLOY
      # ==========================================================

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

        run: |
          ssh \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=60 \
            -o ConnectTimeout=30 \
            "${VPS_USER}@${VPS_HOST}" << EOF

            set -e

            cd "${DEPLOY_PATH}"

            echo "========================================"
            echo "        UPDATE CODE"
            echo "========================================"

            git fetch origin master
            git reset --hard origin/master

            git clean -fd \
              -e .env.prod \
              -e Bokhar-Frontend/.env


            echo "========================================"
            echo "        DOCKER BUILD & START"
            echo "========================================"

            docker compose up -d --build


            echo "========================================"
            echo "        DATABASE MIGRATIONS"
            echo "========================================"

            docker compose exec -T backend \
              python manage.py migrate --noinput


            echo "========================================"
            echo "        COLLECT STATIC"
            echo "========================================"

            docker compose exec -T backend \
              python manage.py collectstatic --noinput


            echo "========================================"
            echo "        RESTART BACKEND"
            echo "========================================"

            docker compose restart backend celery celery_beat


            echo "========================================"
            echo "        STATUS"
            echo "========================================"

            docker compose ps


            echo "========================================"
            echo "        CLEAN OLD IMAGES"
            echo "========================================"

            docker image prune -f


            echo "========================================"
            echo "        DEPLOYMENT SUCCESS"
            echo "========================================"

          EOF


      # ==========================================================
      # HEALTH CHECK
      # ==========================================================

      - name: Health Check
        if: success()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

        run: |
          ssh \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=60 \
            "${VPS_USER}@${VPS_HOST}" << EOF

            set -e

            cd "${DEPLOY_PATH}"

            echo "===== CONTAINERS ====="
            docker compose ps

            echo "===== BACKEND LOGS ====="
            docker compose logs backend --tail=30

            echo "===== FRONTEND LOGS ====="
            docker compose logs frontend --tail=30

            echo "===== CELERY LOGS ====="
            docker compose logs celery --tail=30

            echo "===== CELERY BEAT LOGS ====="
            docker compose logs celery_beat --tail=30

          EOF


      # ==========================================================
      # LOGS IF DEPLOYMENT FAILS
      # ==========================================================

      - name: Show logs if failed
        if: failure()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

        run: |
          ssh \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=60 \
            "${VPS_USER}@${VPS_HOST}" << EOF || true

            cd "${DEPLOY_PATH}"

            echo "===== STATUS ====="
            docker compose ps

            echo "===== BACKEND LOGS ====="
            docker compose logs backend --tail=100

            echo "===== FRONTEND LOGS ====="
            docker compose logs frontend --tail=100

            echo "===== CELERY LOGS ====="
            docker compose logs celery --tail=100

            echo "===== CELERY BEAT LOGS ====="
            docker compose logs celery_beat --tail=100

          EOF