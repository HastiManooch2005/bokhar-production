name: Deploy to VPS

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Production Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" << EOF
            set -e

            cd "${DEPLOY_PATH}"

            echo "===== UPDATE CODE ====="

            git fetch origin
            git reset --hard origin/master

            git clean -fd \
              -e .env.prod \
              -e Bokhar-Frontend/.env

            echo "===== DOCKER VERSION ====="

            docker --version
            docker compose version

            echo "===== BUILD IMAGES ====="

            docker compose build --pull backend frontend

            echo "===== START DATABASE ====="

            docker compose up -d db redis

            echo "===== WAIT FOR DATABASE ====="

            sleep 10

            echo "===== START BACKEND ====="

            docker compose up -d backend

            echo "===== MIGRATIONS ====="

            docker compose exec -T backend \
              python manage.py migrate --noinput

            echo "===== COLLECT STATIC ====="

            docker compose exec -T backend \
              python manage.py collectstatic --noinput

            echo "===== START CELERY ====="

            docker compose up -d celery celery_beat

            echo "===== START FRONTEND ====="

            docker compose up -d frontend

            echo "===== STATUS ====="

            docker compose ps

            echo "===== CLEAN OLD IMAGES ====="

            docker image prune -f

            echo "===== DEPLOYMENT SUCCESS ====="
          EOF

      - name: Health Check
        if: success()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" << EOF
            set -e

            cd "${DEPLOY_PATH}"

            echo "===== CONTAINERS ====="
            docker compose ps

            echo "===== BACKEND ====="
            docker compose logs backend --tail=30

            echo "===== FRONTEND ====="
            docker compose logs frontend --tail=30
          EOF

      - name: Show logs if failed
        if: failure()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" << EOF || true
            cd "${DEPLOY_PATH}"

            echo "===== STATUS ====="
            docker compose ps

            echo "===== BACKEND LOGS ====="
            docker compose logs backend --tail=100

            echo "===== FRONTEND LOGS ====="
            docker compose logs frontend --tail=100

            echo "===== CELERY LOGS ====="
            docker compose logs celery --tail=100

            echo "===== CELERY BEAT LOGS ====="
            docker compose logs celery_beat --tail=100
          EOF